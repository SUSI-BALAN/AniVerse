name: AniVerse CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aniverse_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: aniverse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aniverse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_MODE: sqlite
      AUTH_MODE: local
      TEST_DATABASE_URL: postgresql://aniverse_test:test-only-password@127.0.0.1:5432/aniverse_test
      PLAYWRIGHT_BROWSERS_PATH: client/.playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --omit=dev
      - run: npm audit
        continue-on-error: true
